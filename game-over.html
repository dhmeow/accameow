<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#160307">
  <title>CYBER//CHALLENGE — Game Over</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="cyberpunk.css">
</head>
<body class="app-shell game-over-mode">
  <div class="game-red-bg"></div><div class="scanlines red-scanlines"></div><div class="noise-layer"></div>
  <div class="hud-deco deco-top-left">SYSTEM FAILURE // 0x00FF<br><span>PROTOCOL // TERMINATED</span></div>
  <div class="hud-deco deco-top-right">ACCESS // DENIED<br><span>CHALLENGE // FAILED</span></div>
  <main class="screen page-screen">
    <section class="gameover-panel hud-frame interactive-panel">
      <div class="panel-kicker">// NO SELECTED</div>
      <p class="failure-copy">CHALLENGE TERMINATED</p>
      <h1 class="gameover-you" data-glitch="YOU LOST">YOU LOST</h1>
      <h2 class="gameover-big" data-glitch="GAME OVER">GAME OVER</h2>
      <div class="failure-stack">
        <span>ACCESS DENIED</span>
        <span>PROTOCOL FAILED</span>
        <span>SYSTEM LOCKED</span>
      </div>
      <a class="cyber-btn restart-btn" href="index.html?restart=1">
        <span class="btn-id">[R]</span>
        <span class="btn-main">RESTART</span>
        <span class="btn-meta">RESET EXPERIENCE</span>
      </a>
    </section>
  </main>
  <script src="effects.js"></script>
  <script src="page.js"></script>
</body>
</html>
